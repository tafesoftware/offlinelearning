{% extends 'base.html' %}
{% block title %}{{ page_title }} - Offline LMS{% endblock %}

{% block content %}
<div class="container" style="max-width: 760px; margin-top: 2rem;">
  <div class="card">
    <div class="card-header">
      <h1 style="font-size: 1.5rem; margin: 0;">{{ page_title }}</h1>
    </div>
    <div class="card-body">
      <p>{{ intro }}</p>
      <ul style="padding-left: 1.25rem; margin-top: 1rem;">
        {% for detail in details %}
          <li style="margin-bottom: 0.75rem;">{{ detail }}</li>
        {% endfor %}
      </ul>
      <a href="{{ url_for('pages.home') }}" class="btn btn-secondary mt-2">Home</a>
    </div>
  </div>
</div>
{% endblock %}
