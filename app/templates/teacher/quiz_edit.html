{% extends 'base.html' %}
{% block title %}Create Quiz - Offline LMS{% endblock %}

{% block content %}
<div class="container" style="max-width: 860px;">
  <div class="mb-3">
    <a href="{{ url_for('student.subject_detail', subject_id=subject.id) }}" class="text-sm text-muted">
      &larr; Back to {{ subject.title }}
    </a>
  </div>

  <div class="card mb-4">
    <div class="card-header">
      <h2>Create New Quiz for {{ subject.title }}</h2>
    </div>
    <div class="card-body">
      <form method="POST" id="quiz-builder-form">
        <div class="form-group">
          <label class="form-label" for="title">Quiz Title</label>
          <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Water Filtration Comprehension Check" required>
        </div>

        <div class="grid grid-cols-2" style="gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="lesson_id">Attach to Specific Lesson (Optional)</label>
            <select id="lesson_id" name="lesson_id" class="form-control">
              <option value="">-- General Module Quiz --</option>
              {% for l in lessons %}
                <option value="{{ l.id }}">Lesson {{ l.order_num }}: {{ l.title }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="passing_score">Passing Score Percentage</label>
            <input type="number" id="passing_score" name="passing_score" class="form-control" value="70" min="10" max="100" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Instructions / Description</label>
          <input type="text" id="description" name="description" class="form-control" placeholder="Short instructions for students...">
        </div>

        <hr class="mb-4 mt-4" style="border:0; border-top: 1px solid var(--border);">

        <!-- Dynamic Questions List -->
        <div class="d-flex justify-between align-center mb-3">
          <h3>Question Bank</h3>
          <button type="button" onclick="addQuestionCard()" class="btn btn-secondary text-sm">+ Add Another Question</button>
        </div>

        <div id="questions-wrapper">
          <!-- Question 1 Template -->
          <div class="card mb-3 question-card-item" style="border-left: 4px solid var(--primary);">
            <div class="card-body">
              <div class="d-flex justify-between align-center mb-2">
                <strong>Question 1</strong>
              </div>
              <div class="form-group mb-2">
                <input type="text" name="question_text[]" class="form-control" placeholder="Type the question here..." required>
              </div>

              <div class="grid grid-cols-2" style="gap: 0.5rem; margin-bottom: 0.75rem;">
                <div>
                  <label class="text-xs text-muted">Option A</label>
                  <input type="text" name="option_a[]" class="form-control text-sm" placeholder="Option A" required>
                </div>
                <div>
                  <label class="text-xs text-muted">Option B</label>
                  <input type="text" name="option_b[]" class="form-control text-sm" placeholder="Option B" required>
                </div>
                <div>
                  <label class="text-xs text-muted">Option C</label>
                  <input type="text" name="option_c[]" class="form-control text-sm" placeholder="Option C" required>
                </div>
                <div>
                  <label class="text-xs text-muted">Option D</label>
                  <input type="text" name="option_d[]" class="form-control text-sm" placeholder="Option D" required>
                </div>
              </div>

              <div class="grid grid-cols-2" style="gap: 1rem;">
                <div class="form-group mb-0">
                  <label class="text-xs text-muted">Correct Option</label>
                  <select name="correct_option[]" class="form-control text-sm">
                    <option value="0">Option A</option>
                    <option value="1">Option B</option>
                    <option value="2">Option C</option>
                    <option value="3">Option D</option>
                  </select>
                </div>
                <div class="form-group mb-0">
                  <label class="text-xs text-muted">Educational Explanation (Shown after grading)</label>
                  <input type="text" name="explanation[]" class="form-control text-sm" placeholder="Why this is the correct answer...">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-between align-center mt-4">
          <a href="{{ url_for('student.subject_detail', subject_id=subject.id) }}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Quiz & Questions</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let questionCount = 1;

  function addQuestionCard() {
    questionCount++;
    const wrapper = document.getElementById('questions-wrapper');
    const div = document.createElement('div');
    div.className = 'card mb-3 question-card-item';
    div.style.borderLeft = '4px solid var(--primary)';
    div.innerHTML = `
      <div class="card-body">
        <div class="d-flex justify-between align-center mb-2">
          <strong>Question ${questionCount}</strong>
          <button type="button" onclick="this.closest('.question-card-item').remove()" class="text-danger text-sm" style="background:none;border:none;cursor:pointer;">Remove</button>
        </div>
        <div class="form-group mb-2">
          <input type="text" name="question_text[]" class="form-control" placeholder="Type the question here..." required>
        </div>
        <div class="grid grid-cols-2" style="gap: 0.5rem; margin-bottom: 0.75rem;">
          <div>
            <label class="text-xs text-muted">Option A</label>
            <input type="text" name="option_a[]" class="form-control text-sm" placeholder="Option A" required>
          </div>
          <div>
            <label class="text-xs text-muted">Option B</label>
            <input type="text" name="option_b[]" class="form-control text-sm" placeholder="Option B" required>
          </div>
          <div>
            <label class="text-xs text-muted">Option C</label>
            <input type="text" name="option_c[]" class="form-control text-sm" placeholder="Option C" required>
          </div>
          <div>
            <label class="text-xs text-muted">Option D</label>
            <input type="text" name="option_d[]" class="form-control text-sm" placeholder="Option D" required>
          </div>
        </div>
        <div class="grid grid-cols-2" style="gap: 1rem;">
          <div class="form-group mb-0">
            <label class="text-xs text-muted">Correct Option</label>
            <select name="correct_option[]" class="form-control text-sm">
              <option value="0">Option A</option>
              <option value="1">Option B</option>
              <option value="2">Option C</option>
              <option value="3">Option D</option>
            </select>
          </div>
          <div class="form-group mb-0">
            <label class="text-xs text-muted">Educational Explanation</label>
            <input type="text" name="explanation[]" class="form-control text-sm" placeholder="Why this is the correct answer...">
          </div>
        </div>
      </div>
    `;
    wrapper.appendChild(div);
  }
</script>
{% endblock %}
