{% extends 'base.html' %}
{% block title %}Register - Offline LMS{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; margin-top: 2rem;">
  <div class="card">
    <div class="card-header text-center" style="display:block; padding: 1.5rem 1rem;">
      <h2>Create Local Account</h2>
      <p class="text-muted text-sm">Register to study or manage offline courses</p>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="grid grid-cols-2" style="gap: 0.75rem;">
          <div class="form-group">
            <label class="form-label" for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" class="form-control" placeholder="e.g. Samuel" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" class="form-control" placeholder="e.g. Kiptoo" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Username or ID</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="e.g. samuel_k" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role</label>
          <select id="role" name="role" class="form-control">
            <option value="student" selected>Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="grade_level">Grade / Class Level</label>
          <select id="grade_level" name="grade_level" class="form-control">
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9" selected>Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
        </div>

        <div class="form-group" id="stream-group" hidden>
          <label class="form-label" for="stream">Grades 11-12 Field</label>
          <select id="stream" name="stream" class="form-control" disabled>
            <option value="">Choose a field</option>
            <option value="Natural Science">Natural Science</option>
            <option value="Social Science">Social Science</option>
          </select>
        </div>

        <div class="form-group" id="subject-preview" hidden aria-live="polite">
          <p class="form-label" id="subject-preview-label">Subjects for selected field</p>
          <ul id="stream-subject-list" style="margin-left: 1.25rem;"></ul>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password / PIN</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Complete Registration</button>
      </form>
    </div>
    <div class="card-footer text-center">
      <p class="text-sm">Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (() => {
    const gradeLevel = document.getElementById('grade_level');
    const streamGroup = document.getElementById('stream-group');
    const streamSelect = document.getElementById('stream');
    const subjectPreview = document.getElementById('subject-preview');
    const subjectPreviewLabel = document.getElementById('subject-preview-label');
    const subjectList = document.getElementById('stream-subject-list');
    const subjects = {{ registration_subjects|tojson }};

    function updateStreamSubjects() {
      const grade = gradeLevel.value;
      const isSeniorGrade = grade === 'Grade 11' || grade === 'Grade 12';
      streamGroup.hidden = !isSeniorGrade;
      streamSelect.disabled = !isSeniorGrade;
      streamSelect.required = isSeniorGrade;
      subjectPreview.hidden = true;
      while (subjectList.firstChild) {
        subjectList.removeChild(subjectList.firstChild);
      }

      if (!isSeniorGrade || !streamSelect.value) {
        return;
      }

      const visibleSubjects = subjects.filter(subject =>
        subject.grade_level === grade &&
        (subject.stream === streamSelect.value || subject.stream === 'Common')
      );
      subjectPreviewLabel.textContent = `${grade} ${streamSelect.value} subjects`;
      if (visibleSubjects.length === 0) {
        const item = document.createElement('li');
        item.textContent = 'No subjects are available for this field yet.';
        subjectList.appendChild(item);
      } else {
        visibleSubjects.forEach(subject => {
          const item = document.createElement('li');
          item.textContent = subject.name + (subject.stream === 'Common' ? ' (Common)' : '');
          subjectList.appendChild(item);
        });
      }
      subjectPreview.hidden = false;
    }

    gradeLevel.addEventListener('change', updateStreamSubjects);
    streamSelect.addEventListener('change', updateStreamSubjects);
    updateStreamSubjects();
  })();
</script>
{% endblock %}
